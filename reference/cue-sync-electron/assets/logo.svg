<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1ed760;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1db954;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="url(#bgGrad)"/>
  <!-- Outer diamond (stroke) -->
  <polygon 
    points="512,80 944,512 512,944 80,512" 
    fill="none" 
    stroke="url(#greenGrad)" 
    stroke-width="56"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  <!-- Inner diamond (filled) -->
  <polygon 
    points="512,320 704,512 512,704 320,512" 
    fill="url(#greenGrad)"
    filter="url(#glow)"
  />
</svg>
