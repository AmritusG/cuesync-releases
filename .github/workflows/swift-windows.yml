# Copy to `.github/workflows/swift-windows.yml` in the app you're porting.
# Compiles the Swift port on a REAL Windows x64 runner (and macOS) so the build
# is verified where you can't compile locally. Download the built artifact from
# the run's "Artifacts" section.
#
# Design notes (why this is split per-OS):
#   * macOS runners ship Xcode + Swift preinstalled — installing a second
#     toolchain is unnecessary and was breaking the build. So macOS just uses
#     the built-in `swift`.
#   * Windows has no bundled Swift. We install it with compnerd's action, which
#     sets up the toolchain + Windows SDK. A flaky signature check on swift.org
#     can 404; pin the tag to a release whose windows package is known-good.
name: swift-windows

on:
  push:
    branches: [main, "adw/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # -------- macOS: use the preinstalled toolchain, no setup action --------
  macos:
    name: swift · macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # swift-cross-ui's own dependency closure (swift-syntax macros, WinUI/image
      # codec targets, etc. — CUESYNC-5 §0) compiles from absolute zero on every
      # push with no cache, which by itself was pushing "Build (release)" past
      # 15 minutes and total job time past the 1800s ceiling. Caching `.build`
      # keyed on Package.resolved means only a changed manifest re-triggers a
      # full rebuild; unrelated commits hit a warm cache.
      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: macos-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            macos-spm-

      - name: Swift version
        run: swift --version

      # spec CUESYNC-6 §C.14: once the CueSync executable target depends
      # unconditionally on GtkBackend (§A/§B), the macOS SwiftPM leg needs a
      # real GTK 4 too, or "swift build -c release" goes red here exactly the
      # way it would on Windows without one. Locally verified (findings doc
      # §0.5): `brew install gtk4` (Homebrew 4.22.4 as of that check) is
      # sufficient for GtkBackend to compile and link on macOS arm64; pkg-config
      # ships with Homebrew's base install already, but naming it explicitly
      # here matches upstream swift-cross-ui's own macOS job and costs nothing
      # extra when it's already present. Not version-pinnable in the ordinary
      # way — brew installs whatever the tap currently carries — flagged as a
      # known weakness in the PR per spec §4, not silently treated as reproducible.
      - name: Install GTK 4
        run: brew install pkg-config gtk4

      - name: Build (release)
        run: swift build -c release
      # -c release: reuses the object files "Build (release)" just produced
      # instead of triggering a second, fully separate debug compile of the
      # whole dependency graph (swift-cross-ui, swift-syntax macros, CSQLite,
      # CZlib) — that redundant double-build is what was pushing total CI
      # time past the 1800s ceiling.
      - name: Test
        run: swift test -c release
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cuesync-macos
          path: .build/release/
          if-no-files-found: ignore

  # -------- Windows x64: install Swift, then build --------
  #
  # Split into two independent jobs (build / test) instead of one sequential
  # job. `CueSyncCoreTests` depends only on CueSyncCore/CSQLite/CZlib (see
  # Package.swift) — never on the CueSync executable target, which is what
  # pulls in swift-cross-ui's whole dependency closure (swift-syntax macros,
  # WinUI projections, image codecs). That closure is what made "Build
  # (release)" alone take ~19 minutes with a cold cache; running it after Test
  # serialized the two into ~30 minutes in a single job, over the 1800s
  # ceiling. Since GitHub Actions already runs jobs without a `needs:` edge in
  # parallel, giving build and test their own jobs lets the ~10-minute test
  # job finish alongside the ~19-minute build job instead of after it — the
  # toolchain/VS setup steps are duplicated, but that's a couple of minutes,
  # not the ~10 minutes this saves off the critical path.
  windows-build:
    name: swift · windows-latest (build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # swift-cross-ui's WinUIBackend (CUESYNC-5) depends on swift-winui, whose
      # own compile-time prerequisite is the Windows 10.0.17763.0 SDK
      # (https://github.com/moreSwift/swift-winui#compiletime-dependencies:
      # `winget install --id Microsoft.WindowsSDK.10.0.17763`). No install step
      # is added here: actions/runner-images' own Windows2022-Readme.md lists
      # 10.0.17763.0 among the SDKs windows-latest already ships, and winget
      # itself isn't in that image's documented tool inventory, so adding an
      # unverified winget step would trade a real, checked prerequisite for an
      # unverified one. If a future runner image drops this SDK, that will
      # surface as a hard failure in "Build (release)" below — the fix then is
      # a pinned SDK install step here, not a silent workaround.

      # WinUIBackend needs the MSVC linker + Windows SDK environment that
      # Visual Studio's vcvars normally sets up — swift-cross-ui's own CI
      # (build-test-and-docs.yml, windows job) does the same before building
      # WinUIBackend. Pinned to the v5 tag's commit, not a floating major-version ref.
      - name: Setup VS Dev Environment
        uses: seanmiddleditch/gha-setup-vsdevenv@cf96bf5b227cac6af28c04c4a4e69286ea444163 # v5

      # Installs the Swift toolchain + Windows SDK via the official
      # Swift-on-Windows action. We use compnerd (not SwiftyLab) because recent
      # swift.org Windows installers are published WITHOUT a `.sig` file, and
      # SwiftyLab hard-fails signature verification ("No signature at
      # .../windows10.exe.sig"). compnerd installs directly, no swiftorg signature
      # gate. It needs BOTH the release branch and the build id. Pinned to the
      # v0.4.0 tag's commit, not the floating `main` branch.
      #
      # spec CUESYNC-6c §2 step 6: the install reaches out to swift.org over the
      # public network and a transient blip fails the whole job, so the first
      # attempt is allowed to fail (continue-on-error) and a second, identical
      # attempt runs only if it did. Gated on `outcome`, not `conclusion` —
      # under continue-on-error a failed step still reports `conclusion: success`,
      # so gating on conclusion would mean the retry step never fires. The retry
      # itself must NOT carry continue-on-error, so a total failure still fails
      # the job loudly instead of surfacing as a confusing compile error later.
      - id: swift-install
        continue-on-error: true
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # v0.4.0
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - name: Retry Swift toolchain install
        if: steps.swift-install.outcome == 'failure'
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # v0.4.0
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      # spec CUESYNC-6 §0.4/§C.13 — GTK 4 distribution: **vcpkg**, not the
      # spec's original gvsbuild/MSYS2 candidates (findings doc §0.4 revised
      # this after checking swift-cross-ui's own docs/CI at the pinned
      # revision — upstream states plainly it only supports GTK-on-Windows via
      # vcpkg). vcpkg builds GTK 4 from source rather than shipping a
      # downloadable prebuilt binary, so — per spec §4 — the correct pin point
      # is the vcpkg tool's own git commit, not a SHA-256 of an asset that
      # doesn't exist. `2026.06.24` (commit 52c9e08cdf8580d2d9762f547d22b96fd81e82f2),
      # the newest vcpkg tag at CI-wiring time, confirmed to contain a `gtk`
      # port (version 4.22.4) via the GitHub API before being pinned here.
      # Caching `vcpkg/installed` separately from the SwiftPM `.build` cache
      # below: a cold-cache GTK 4 build is 45+ minutes (findings doc §0.4), so
      # this is the single biggest cost in the job and deserves its own key.
      - name: Cache vcpkg GTK 4 install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vcpkg/installed
          key: windows-build-vcpkg-gtk4-52c9e08cdf8580d2d9762f547d22b96fd81e82f2
          restore-keys: |
            windows-build-vcpkg-gtk4-

      # CI-observed (this branch, runs 29549794499 and 29551076324): the
      # win25-vs2026 runner image does not resolve a bare `powershell.exe` on
      # PATH — only `pwsh.exe` (PowerShell 7) is present, even though PATH
      # still lists the legacy WindowsPowerShell\v1.0 directory. vcpkg's
      # bootstrap-vcpkg.bat hardcodes `powershell.exe -NoProfile
      # -ExecutionPolicy Bypass "& {...}"` — a bare name, not a full path — so
      # it fails with "not recognized as an internal or external command"
      # before vcpkg ever builds, and every step after it fails in turn.
      #
      # A prior fix shimmed a `powershell.exe` (a copy of pwsh.exe) onto PATH
      # for this step's own process, on the theory that every child process
      # this step spawns — including cmd.exe via the .bat — inherits that
      # PATH. Run 29551076324 shows that theory is wrong in practice: the
      # exact same "'powershell.exe' is not recognized" error recurs even
      # with the shim built and `$env:PATH` mutated in-process immediately
      # before the clone. Rather than keep guessing at why the shim doesn't
      # propagate, sidestep bootstrap-vcpkg.bat entirely: fetching it at the
      # pinned commit shows it is a two-line wrapper —
      # `@echo off` + `powershell.exe ... "& {& \"%~dp0scripts\bootstrap.ps1\" %*}"`
      # — around `scripts\bootstrap.ps1`, which is itself a self-contained
      # PowerShell script (resolves its own directory via `$PSScriptRoot`,
      # downloads `vcpkg.exe` directly from the pinned vcpkg-tool release).
      # This step already runs under `shell: pwsh`, i.e. inside a real
      # PowerShell process — invoking `scripts/bootstrap.ps1` directly runs
      # the identical logic the .bat would have, with no bare `powershell.exe`
      # lookup anywhere in the chain, and no dependency on what this runner
      # image does or doesn't ship at the legacy WindowsPowerShell path.
      # Install GTK 4 (vcpkg, pinned). Deliberately clones vcpkg fresh rather
      # than using the copy windows-latest ships at C:\vcpkg (runner-images'
      # Windows2022-Readme.md documents it, unpinned and updated on whatever
      # schedule the image maintainers choose) — cloning and checking out an
      # exact commit is the reproducible pin spec §4 requires. Classic
      # (non-manifest) mode: the port set available is exactly what ships at
      # the pinned commit, so pinning the vcpkg checkout pins the GTK 4 build
      # recipe with it. `vcpkg install` is idempotent against an
      # already-populated `installed/` tree (restored above on a cache hit),
      # so this step is left unconditional rather than skipped on cache hit —
      # a skip-on-hit would be exactly the "stale cache hides a broken
      # install" failure mode spec §C.13 warns against.
      #
      # The pin (52c9e08c...) is the SHA of the `2026.06.24` *tag object*, not
      # a commit — `git checkout` correctly detaches to the tag's target
      # commit (subject "[comms-ublox] update to 3.0.7 (#52583)"), which is
      # why that subject looks unrelated to GTK: it's just whatever commit
      # happened to be tip-of-branch when upstream cut that release tag.
      # Confirmed via `git fetch --depth 1 origin 52c9e08c...` against the
      # real microsoft/vcpkg remote before writing this comment — the object
      # exists and resolves deterministically; GitHub's REST commits API
      # 404s on it only because that endpoint doesn't accept tag object SHAs,
      # not because the pin is wrong.
      - name: Install GTK 4 (vcpkg, pinned)
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg
          git -C vcpkg checkout 52c9e08cdf8580d2d9762f547d22b96fd81e82f2
          & "./vcpkg/scripts/bootstrap.ps1"
          ./vcpkg/vcpkg install gtk --triplet x64-windows

      # spec §0.3(a): SwiftPM's systemLibrary pkgConfig: resolution needs GTK's
      # .pc files reachable via PKG_CONFIG_PATH. SwiftPM parses .pc files
      # itself (PackageLoading/PkgConfig.swift) rather than shelling out for
      # that part, but it does still probe for a literal `pkg-config`
      # executable to discover built-in search paths — that probe degrades to
      # a diagnostic rather than a hard failure if the binary is absent, but
      # providing one is cheap and removes an unknown. vcpkg vendors pkgconf as
      # a fetchable host tool; copy it to a `pkg-config.exe`-named copy since
      # that is the literal name SwiftPM looks for.
      - name: Configure pkg-config for vcpkg GTK 4
        shell: pwsh
        run: |
          $pkgconf = (./vcpkg/vcpkg fetch pkgconf | Select-Object -Last 1)
          $pkgconfDir = Split-Path $pkgconf
          Copy-Item $pkgconf (Join-Path $pkgconfDir "pkg-config.exe") -Force
          Add-Content $env:GITHUB_PATH $pkgconfDir
          Add-Content $env:GITHUB_ENV "PKG_CONFIG_PATH=$PWD\vcpkg\installed\x64-windows\lib\pkgconfig"

      # Same rationale as the macOS leg's cache step: a from-scratch compile of
      # swift-cross-ui's dependency closure is the dominant cost of this job
      # (Build (release) alone ran ~19 minutes with no cache), and Windows is
      # already the slower leg due to the toolchain/VS setup steps above.
      # Key extended with the pinned vcpkg commit (spec §C.13): Package.resolved
      # itself does not change for this ticket (§A.9), so hashing it alone can
      # never invalidate this cache when the GTK version changes — the pinned
      # commit literal is the actual GTK input and must be bumped by hand
      # alongside the "Install GTK 4" step above whenever the pin moves.
      # spec CUESYNC-6c §2 step 7: also extended with the Swift toolchain
      # version — .swiftmodule files are compiler-version-locked, so a 6.1-built
      # .build tree must not be handed to the 6.3.3 compiler this job now installs.
      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: windows-build-spm-swift-6.3.3-vcpkg-52c9e08cdf8580d2d9762f547d22b96fd81e82f2-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            windows-build-spm-swift-6.3.3-vcpkg-

      - name: Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      # spec §D.17: bundle the GTK 4 runtime (and its transitive closure —
      # glib, cairo, pango, harfbuzz, gdk-pixbuf, graphene, fribidi, libepoxy,
      # the image codecs, intl, zlib and friends) next to CueSync.exe so the
      # uploaded cuesync-windows artifact is self-contained. Copy everything
      # vcpkg placed in the triplet's bin/ rather than hand-curating the list —
      # the §D.18 closure check below is what tells us what's actually required.
      - name: Bundle GTK 4 runtime DLLs next to CueSync.exe
        shell: pwsh
        run: |
          Get-ChildItem vcpkg\installed\x64-windows\bin -File |
            Where-Object { $_.Extension -eq '.dll' } |
            Copy-Item -Destination .build\release\ -Force

      # spec §0.6/§D.18 — the dependency-checking tool: marcoesposito1988/
      # dependency_runner's `wldd` ("ldd for Windows"), corrected from the
      # ticket's conflated owner/binary name per findings doc §0.6. Its
      # release assets publish no checksums, so — per spec §4 — the SHA-256 is
      # computed once here and verified BEFORE extraction, not after.
      - name: Install dependency-closure checker (wldd v1.5.0, pinned)
        shell: pwsh
        run: |
          $wlddZip = "$env:RUNNER_TEMP\wldd.zip"
          Invoke-WebRequest -Uri "https://github.com/marcoesposito1988/dependency_runner/releases/download/v1.5.0/wldd-x86_64-pc-windows-msvc.zip" -OutFile $wlddZip
          $expectedSha256 = "2DFB5102A00D5E6A368F2A5E0F78733B9EFD7D629B4E90952F3759625971D016"
          $actualSha256 = (Get-FileHash $wlddZip -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            Write-Error "wldd.zip checksum mismatch: expected $expectedSha256, got $actualSha256"
            exit 1
          }
          Expand-Archive -Path $wlddZip -DestinationPath "$env:RUNNER_TEMP\wldd" -Force
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\wldd"

      # spec §D.18/§D.19 — the closure check itself, plus its mandatory
      # negative control. Contract (§D.18): resolve CueSync.exe's transitive
      # import closure via the real Windows DLL search order; fail the job on
      # any unresolved DLL, or any non-system DLL resolved from outside the
      # artifact directory. The system allowlist is the narrow, explicit list
      # below — no wildcard beyond the spec-sanctioned `api-ms-win-*` family.
      # `wldd` itself always exits 0 (it is an inspection tool, not a gate —
      # confirmed by reading its source), so the gating is done here by
      # parsing its `name => path` / `name => not found` output, matching
      # spec §D.18's "fails the job" requirement rather than trusting an exit
      # code nobody would otherwise inspect.
      #
      # The Swift runtime DLLs (swiftCore.dll, Foundation.dll, dispatch.dll,
      # BlocksRuntime.dll, ...) are deliberately NOT in this allowlist and are
      # NOT bundled — spec §D.18 forbids allowlisting them into silence, and
      # this ticket leaves bundling them genuinely out of scope: on the CI
      # runner they resolve via the Swift toolchain's PATH, so this check
      # stays green here, but a DJ's machine will not have them. That gap is
      # real, is not covered by this check, and is the next ticket's work.
      #
      # §D.19: a check that passes proves nothing until watched to fail for
      # the right reason. This step removes one bundled DLL, re-runs the
      # check and asserts it FAILS, restores the DLL, then re-runs once more
      # and asserts it PASSES again.
      - name: Verify DLL closure (clean run, then negative control)
        shell: pwsh
        run: |
          $allow = @(
            'kernel32.dll','user32.dll','gdi32.dll','advapi32.dll','ole32.dll',
            'oleaut32.dll','shell32.dll','shlwapi.dll','ws2_32.dll','ucrtbase.dll',
            'msvcrt.dll','ntdll.dll','crypt32.dll','bcrypt.dll','version.dll',
            'winmm.dll','dwmapi.dll','comctl32.dll','comdlg32.dll','imm32.dll',
            'setupapi.dll','api-ms-win-*'
          )
          $artifactDir = (Resolve-Path ".build\release").Path

          function Test-DllClosure {
            param([string]$exePath)
            $lines = & wldd $exePath
            $lines | ForEach-Object { Write-Host $_ }
            $failed = $false
            foreach ($rawLine in $lines) {
              $trimmedLine = $rawLine.Trim()
              if ($trimmedLine.EndsWith(' => not found')) {
                Write-Error "unresolved dependency: $trimmedLine"
                $failed = $true
                continue
              }
              $separatorIndex = $trimmedLine.IndexOf(' => ')
              if ($separatorIndex -gt 0) {
                $name = $trimmedLine.Substring(0, $separatorIndex).Trim()
                $path = $trimmedLine.Substring($separatorIndex + 4).Trim()
                $isInsideArtifact = $path.StartsWith($artifactDir, [System.StringComparison]::OrdinalIgnoreCase)
                $isAllowedSystemDll = [bool]($allow | Where-Object { $name -like $_ })
                if (-not $isInsideArtifact -and -not $isAllowedSystemDll) {
                  Write-Error "non-system DLL resolved outside the artifact directory: $name => $path"
                  $failed = $true
                }
              }
            }
            return -not $failed
          }

          Write-Host "== Dependency-closure check (clean) =="
          if (-not (Test-DllClosure ".build\release\CueSync.exe")) { throw "clean dependency-closure check failed" }
          Write-Host "Closure check passed: no missing or non-system DLL found outside the artifact directory."

          $victimDll = (Get-ChildItem ".build\release" -File |
            Where-Object { $_.Extension -eq '.dll' } | Select-Object -First 1).BaseName
          if (-not $victimDll) { Write-Error "no bundled DLL found to use for the negative control"; exit 1 }

          Write-Host "== Negative control: removing $victimDll.dll =="
          Copy-Item ".build\release\$victimDll.dll" "$env:RUNNER_TEMP\$victimDll.dll.bak" -Force
          Remove-Item ".build\release\$victimDll.dll" -Force

          if (Test-DllClosure ".build\release\CueSync.exe") {
            throw "negative control failed: the closure check still passed with $victimDll.dll removed"
          }
          Write-Host "Negative control confirmed: the check correctly failed with $victimDll.dll removed."

          Write-Host "== Restoring $victimDll.dll =="
          Copy-Item "$env:RUNNER_TEMP\$victimDll.dll.bak" ".build\release\$victimDll.dll" -Force

          if (-not (Test-DllClosure ".build\release\CueSync.exe")) {
            throw "closure check still fails after restoring $victimDll.dll"
          }
          Write-Host "Closure check passes again after restoring the DLL."

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cuesync-windows
          path: .build/release/
          if-no-files-found: ignore

  windows-test:
    name: swift · windows-latest (test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup VS Dev Environment
        uses: seanmiddleditch/gha-setup-vsdevenv@cf96bf5b227cac6af28c04c4a4e69286ea444163 # v5

      # spec CUESYNC-6c §2 step 6: retry the toolchain install once on a
      # transient failure — see windows-build's identical comment above for
      # why continue-on-error/outcome/no-continue-on-error-on-retry all matter.
      - id: swift-install
        continue-on-error: true
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # v0.4.0
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - name: Retry Swift toolchain install
        if: steps.swift-install.outcome == 'failure'
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # v0.4.0
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      # CI-observed (this branch, run 29549794499): `swift test` invoked bare
      # builds the WHOLE package manifest first — including the `CueSync`
      # executable target, which depends on GtkBackend/swift-cross-ui — not
      # just CueSyncCoreTests' own dependency subset. This job used to skip
      # installing GTK 4 on the theory that `swift test` only builds what the
      # test target needs; that's wrong on every platform (confirmed locally
      # on macOS too: `swift build --build-tests`/`swift test` always builds
      # every target in the manifest, and `swift build --target
      # CueSyncCoreTests` alone compiles the test module but never performs
      # the final link into a runnable test binary — there's no SwiftPM CLI
      # flag that scopes both compiling AND linking to one target's actual
      # dependency subset). So this job needs the same GTK 4 install as
      # windows-build. Same cache key as windows-build's own "Cache vcpkg GTK
      # 4 install" step (below) so a cache primed by either job's run warms
      # both on the next push.
      - name: Cache vcpkg GTK 4 install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vcpkg/installed
          key: windows-build-vcpkg-gtk4-52c9e08cdf8580d2d9762f547d22b96fd81e82f2
          restore-keys: |
            windows-build-vcpkg-gtk4-

      # Identical rationale/mechanism as windows-build's "Install GTK 4
      # (vcpkg, pinned)" step — see its comments for why this calls
      # `scripts/bootstrap.ps1` directly instead of `bootstrap-vcpkg.bat`
      # (the .bat's bare `powershell.exe` invocation doesn't resolve on this
      # runner image, and a PATH-shim workaround was confirmed not to fix it).
      - name: Install GTK 4 (vcpkg, pinned)
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg
          git -C vcpkg checkout 52c9e08cdf8580d2d9762f547d22b96fd81e82f2
          & "./vcpkg/scripts/bootstrap.ps1"
          ./vcpkg/vcpkg install gtk --triplet x64-windows

      # Identical rationale as windows-build's identically named step.
      - name: Configure pkg-config for vcpkg GTK 4
        shell: pwsh
        run: |
          $pkgconf = (./vcpkg/vcpkg fetch pkgconf | Select-Object -Last 1)
          $pkgconfDir = Split-Path $pkgconf
          Copy-Item $pkgconf (Join-Path $pkgconfDir "pkg-config.exe") -Force
          Add-Content $env:GITHUB_PATH $pkgconfDir
          Add-Content $env:GITHUB_ENV "PKG_CONFIG_PATH=$PWD\vcpkg\installed\x64-windows\lib\pkgconfig"

      # Keyed separately from windows-build's SwiftPM cache: even though both
      # jobs now build the same full package graph, they run on separate
      # runners with independent .build directories, so sharing one cache key
      # between them would just thrash (each job's save would evict the
      # other's). spec CUESYNC-6c §2 step 7: extended with the Swift toolchain
      # version — see windows-build's identical cache comment for why.
      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: windows-test-spm-swift-6.3.3-vcpkg-52c9e08cdf8580d2d9762f547d22b96fd81e82f2-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            windows-test-spm-swift-6.3.3-vcpkg-

      - name: Swift version
        run: swift --version

      # On Windows, `swift test` spawns BOTH the XCTest runner and the
      # swift-testing runner. The swift-testing runner finds 0 tests (the suite
      # is XCTest) and exits non-zero even when every XCTest passes — a spurious
      # failure. So we gate on the XCTest result: fail only if XCTest reports an
      # actual failure; the "0 tests" swift-testing exit is ignored.
      #
      # CI-observed (this branch and adw/CUESYNC-6, both runs): assigning the
      # whole pipeline directly to $out — `$out = swift test ... | Out-String`
      # — captures every line into the variable and prints NONE of it, because
      # output bound to an assignment never reaches the success stream. That
      # made every past failure here show up as a bare "no XCTest summary was
      # found" with the actual compiler/test output nowhere in the log. Run
      # the pipeline as its own statement instead so Tee-Object's pass-through
      # still reaches the host (and therefore the Action log) while $log keeps
      # the same capture the regex below needs.
      - name: Test
        shell: pwsh
        run: |
          swift test -c release 2>&1 | Tee-Object -Variable log
          $out = $log | Out-String
          if ($out -match "with (\d+) failures") {
            $fails = [int]$Matches[1]
            if ($fails -gt 0) { Write-Error "XCTest reported $fails failure(s)"; exit 1 }
            Write-Host "All XCTest tests passed ($fails failures)."
            exit 0
          }
          # No XCTest summary line found — surface the real exit for diagnosis.
          if ($LASTEXITCODE -ne 0) { Write-Error "swift test failed and no XCTest summary was found"; exit 1 }
