# Copy to `.github/workflows/swift-windows.yml` in the app you're porting.
# Compiles the Swift port on a REAL Windows x64 runner (and macOS) so the build
# is verified where you can't compile locally. Download the built artifact from
# the run's "Artifacts" section.
#
# Design notes (why this is split per-OS):
#   * macOS runners ship Xcode + Swift preinstalled — installing a second
#     toolchain is unnecessary and was breaking the build. So macOS just uses
#     the built-in `swift`.
#   * Windows has no bundled Swift. We install it with compnerd's action, which
#     sets up the toolchain + Windows SDK. A flaky signature check on swift.org
#     can 404; pin the tag to a release whose windows package is known-good.
name: swift-windows

on:
  push:
    branches: [main, "adw/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # -------- Guard: UI/ must stay AppKit-free (spec CUESYNC-7 §M.28) --------
  # A machine-checkable proxy for "all Windows UI is CUESYNC_CROSSUI and
  # toolkit-correct": no file under CueSync/CueSync/UI/ may import an
  # AppKit-only framework or reference an NS-prefixed AppKit symbol in real
  # code. Runs on ubuntu-latest (plain text scan, no toolchain needed) so it
  # fails in seconds instead of waiting on the ~20-minute Windows legs.
  # Comment lines (trimmed line starts with "//") are excluded from the
  # NS-prefixed check — several files legitimately mention the macOS
  # original's AppKit types (NSOpenPanel, NSImage, NSColor, ...) in `// PORT:`
  # notes explaining what was re-hosted; only actual code usage must fail.
  guard-crossui-appkit-free:
    name: guard · UI/ is AppKit-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Grep guard — no AppKit/SwiftUI/UniformTypeIdentifiers/AVFoundation/Combine, no NS-prefixed symbols
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' file; do
            if grep -nE '^\s*import[[:space:]]+(AppKit|SwiftUI|UniformTypeIdentifiers|AVFoundation|Combine)([[:space:]]|$)' "$file"; then
              echo "::error file=$file::forbidden import under CUESYNC_CROSSUI UI/ (spec §M.28)"
              fail=1
            fi
            while IFS=: read -r lineno content; do
              [ -z "${lineno:-}" ] && continue
              trimmed="$(printf '%s' "$content" | sed -E 's/^[[:space:]]*//')"
              case "$trimmed" in
                //*) continue ;;
              esac
              echo "::error file=$file,line=$lineno::NS-prefixed AppKit symbol referenced under CUESYNC_CROSSUI UI/ (spec §M.28): $content"
              fail=1
            done < <(grep -nE '\bNS[A-Z][A-Za-z]*\b' "$file" || true)
          done < <(find CueSync/CueSync/UI -name '*.swift' -print0)
          if [ "$fail" -ne 0 ]; then
            echo "Guard failed: UI/ must not import AppKit-only frameworks or use NS-prefixed symbols outside comments."
            exit 1
          fi
          echo "Guard passed: no AppKit/SwiftUI/UniformTypeIdentifiers/AVFoundation/Combine imports and no NS-prefixed symbol usage found under UI/."

  # -------- macOS: use the preinstalled toolchain, no setup action --------
  macos:
    name: swift · macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # swift-cross-ui's own dependency closure (swift-syntax macros, WinUI/image
      # codec targets, etc. — CUESYNC-5 §0) compiles from absolute zero on every
      # push with no cache, which by itself was pushing "Build (release)" past
      # 15 minutes and total job time past the 1800s ceiling. Caching `.build`
      # keyed on Package.resolved means only a changed manifest re-triggers a
      # full rebuild; unrelated commits hit a warm cache.
      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: macos-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            macos-spm-

      - name: Swift version
        run: swift --version

      # spec CUESYNC-6 §C.14: once the CueSync executable target depends
      # unconditionally on GtkBackend (§A/§B), the macOS SwiftPM leg needs a
      # real GTK 4 too, or "swift build -c release" goes red here exactly the
      # way it would on Windows without one. Locally verified (findings doc
      # §0.5): `brew install gtk4` (Homebrew 4.22.4 as of that check) is
      # sufficient for GtkBackend to compile and link on macOS arm64; pkg-config
      # ships with Homebrew's base install already, but naming it explicitly
      # here matches upstream swift-cross-ui's own macOS job and costs nothing
      # extra when it's already present. Not version-pinnable in the ordinary
      # way — brew installs whatever the tap currently carries — flagged as a
      # known weakness in the PR per spec §4, not silently treated as reproducible.
      - name: Install GTK 4
        run: brew install pkg-config gtk4

      - name: Build (release)
        run: swift build -c release
      # -c release: reuses the object files "Build (release)" just produced
      # instead of triggering a second, fully separate debug compile of the
      # whole dependency graph (swift-cross-ui, swift-syntax macros, CSQLite,
      # CZlib) — that redundant double-build is what was pushing total CI
      # time past the 1800s ceiling.
      - name: Test
        run: swift test -c release
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cuesync-macos
          path: .build/release/
          if-no-files-found: ignore

  # -------- Windows x64: install Swift, then build --------
  #
  # Split into two independent jobs (build / test) instead of one sequential
  # job. `CueSyncCoreTests` depends only on CueSyncCore/CSQLite/CZlib (see
  # Package.swift) — never on the CueSync executable target, which is what
  # pulls in swift-cross-ui's whole dependency closure (swift-syntax macros,
  # WinUI projections, image codecs). That closure is what made "Build
  # (release)" alone take ~19 minutes with a cold cache; running it after Test
  # serialized the two into ~30 minutes in a single job, over the 1800s
  # ceiling. Since GitHub Actions already runs jobs without a `needs:` edge in
  # parallel, giving build and test their own jobs lets the ~10-minute test
  # job finish alongside the ~19-minute build job instead of after it — the
  # toolchain/VS setup steps are duplicated, but that's a couple of minutes,
  # not the ~10 minutes this saves off the critical path.
  windows-build:
    name: swift · windows-latest (build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # swift-cross-ui's WinUIBackend (CUESYNC-5) depends on swift-winui, whose
      # own compile-time prerequisite is the Windows 10.0.17763.0 SDK
      # (https://github.com/moreSwift/swift-winui#compiletime-dependencies:
      # `winget install --id Microsoft.WindowsSDK.10.0.17763`). No install step
      # is added here: actions/runner-images' own Windows2022-Readme.md lists
      # 10.0.17763.0 among the SDKs windows-latest already ships, and winget
      # itself isn't in that image's documented tool inventory, so adding an
      # unverified winget step would trade a real, checked prerequisite for an
      # unverified one. If a future runner image drops this SDK, that will
      # surface as a hard failure in "Build (release)" below — the fix then is
      # a pinned SDK install step here, not a silent workaround.

      # WinUIBackend needs the MSVC linker + Windows SDK environment that
      # Visual Studio's vcvars normally sets up — swift-cross-ui's own CI
      # (build-test-and-docs.yml, windows job) does the same before building
      # WinUIBackend. Pinned to the v5 tag's commit, not a floating major-version ref.
      - name: Setup VS Dev Environment
        uses: seanmiddleditch/gha-setup-vsdevenv@cf96bf5b227cac6af28c04c4a4e69286ea444163 # v5

      # Installs the Swift toolchain + Windows SDK via the official
      # Swift-on-Windows action. We use compnerd (not SwiftyLab) because recent
      # swift.org Windows installers are published WITHOUT a `.sig` file, and
      # SwiftyLab hard-fails signature verification ("No signature at
      # .../windows10.exe.sig"). compnerd installs directly, no swiftorg signature
      # gate. It needs BOTH the release branch and the build id. Pinned to the
      # v0.4.0 tag's commit, not the floating `main` branch.
      #
      # spec CUESYNC-6c §2 step 6: the install reaches out to swift.org over the
      # public network and a transient blip fails the whole job, so the first
      # attempt is allowed to fail (continue-on-error) and a second, identical
      # attempt runs only if it did. Gated on `outcome`, not `conclusion` —
      # under continue-on-error a failed step still reports `conclusion: success`,
      # so gating on conclusion would mean the retry step never fires. The retry
      # itself must NOT carry continue-on-error, so a total failure still fails
      # the job loudly instead of surfacing as a confusing compile error later.
      - id: swift-install
        continue-on-error: true
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # v0.4.0
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - name: Retry Swift toolchain install
        if: steps.swift-install.outcome == 'failure'
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # v0.4.0
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      # spec CUESYNC-6d — GTK 4 distribution: **gvsbuild**, replacing CUESYNC-6c's
      # from-source build. Compiling GTK 4's whole dependency tree on every cold
      # runner cost 45+ minutes (CUESYNC-6 findings §0.4) to produce bytes
      # wingtk/gvsbuild already publishes as a versioned, MSVC-built release
      # asset. Swapping the source build for a pinned download turns the
      # slowest step in the pipeline into one that costs seconds.
      #
      # The trade (spec §4): the GTK DLLs shipped inside cuesync-windows go from
      # "compiled on our own runner from a pinned source tree" to "prebuilt
      # binaries produced by a third party (wingtk), identified by a hash". That
      # is a real reduction in provenance, bought deliberately for the 45-minute
      # saving — the SHA-256 below is the entire basis of trust for that trade,
      # not a formality, which is why it is verified BEFORE extraction rather
      # than after (checking a hash post-unpack checks it after untrusted bytes
      # have already touched the filesystem).
      #
      # Pin resolved live against github.com/wingtk/gvsbuild/releases at
      # CI-wiring time: tag `2026.6.0` ("GTK 4.22.4"), asset
      # `GTK4_Gvsbuild_2026.6.0_x64.zip`. URL is `releases/download/<tag>/<asset>`
      # — never `releases/latest/download/...`, which floats. SHA-256 below was
      # computed locally from the downloaded asset (`shasum -a 256`) and
      # independently cross-checked against the `sha256:` digest GitHub's
      # release-assets API reports for the same blob — the two matched exactly.
      # The asset publishes no separate checksums file of its own, so this
      # literal gets the same treatment the dependency-closure checker's pin
      # below already does: computed once, committed, verified every run.
      - name: Install GTK 4 (gvsbuild, pinned)
        shell: pwsh
        run: |
          $gtkZip = "$env:RUNNER_TEMP\gtk4-gvsbuild.zip"
          Invoke-WebRequest -Uri "https://github.com/wingtk/gvsbuild/releases/download/2026.6.0/GTK4_Gvsbuild_2026.6.0_x64.zip" -OutFile $gtkZip
          $expectedSha256 = "01DBF613DE732A42BEDB425F034B84381970A652CEF6C0B3906E4DA1A6C18600"
          $actualSha256 = (Get-FileHash $gtkZip -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            Write-Error "gtk4-gvsbuild.zip checksum mismatch: expected $expectedSha256, got $actualSha256"
            exit 1
          }
          # gvsbuild bakes prefix=C:/gtk-build/gtk/x64/release into every shipped
          # .pc file (confirmed by inspecting lib/pkgconfig/gtk4.pc in the asset).
          # SwiftPM parses .pc files itself (PackageLoading/PkgConfig.swift)
          # rather than shelling out, so `pkgconf --define-prefix` cannot rescue
          # a relocated tree — extracting to that exact baked prefix, rather
          # than rewriting prefix= in all 300+ shipped .pc files, is the simpler
          # of spec §0.2 item 4's two options and the one chosen here. The zip
          # has no wrapping folder (bin/, lib/, include/ sit at its root), so
          # extracting straight to the prefix reproduces it exactly.
          New-Item -ItemType Directory -Force -Path "C:\gtk-build\gtk\x64\release" | Out-Null
          Expand-Archive -Path $gtkZip -DestinationPath "C:\gtk-build\gtk\x64\release" -Force

          # CI-observed (this branch, run 29574422622): even extracted to the
          # exact baked prefix above, both Windows jobs still failed — "gtk/
          # gtk.h file not found" from clang, with a SwiftPM warning right
          # before it: "Expected a value for variable 'prefix'". Root cause,
          # read directly from PackageLoading/PkgConfig.swift's `parse()`: it
          # checks a line for ":" BEFORE checking for "=", so
          # `prefix=C:/gtk-build/gtk/x64/release` — a variable assignment
          # whose value happens to contain a Windows drive-letter colon — is
          # misclassified as an unrecognized `key: value` line (the same shape
          # as `Requires:`/`Libs:`) and silently dropped. Every later
          # `${prefix}`-derived variable (includedir, libdir, ...) then fails
          # to resolve, so every GTK 4 header/lib path SwiftPM handed to clang
          # came back empty. This is independent of the relocation question
          # above: the exact-baked-prefix choice does not dodge it, because
          # the bug fires on ANY colon in a parsed "=" line, not on a
          # relocated path.
          #
          # Confirmed against a known-working precedent for this exact defect
          # (frida/luma's LumaGtk, which hits the identical GTK-on-Windows
          # pkg-config parsing bug): rewrite each shipped .pc file's
          # `prefix=` line to a colon-free, `${pcfiledir}`-relative form.
          # `lib\pkgconfig` sits two directories below the extraction root, so
          # `${pcfiledir}/../..` recomputes the identical absolute path.
          # `pcfiledir` is supplied directly by SwiftPM itself (same `parse()`,
          # set before the file is read — not parsed off this line), so it
          # never goes through the buggy ":"-before-"=" check. Idempotent:
          # re-running against an already-patched file is a no-op.
          Get-ChildItem -Path "C:\gtk-build\gtk\x64\release\lib\pkgconfig" -File |
            Where-Object { $_.Extension -eq '.pc' } | ForEach-Object {
            $pcContent = Get-Content -Raw -LiteralPath $_.FullName
            $pcPatched = $pcContent -replace '(?m)^prefix=.*', 'prefix=${pcfiledir}/../..'
            [System.IO.File]::WriteAllText($_.FullName, $pcPatched, [System.Text.UTF8Encoding]::new($false))
          }

      # spec §0.3(a): SwiftPM's systemLibrary pkgConfig: resolution needs GTK's
      # .pc files reachable via PKG_CONFIG_PATH. SwiftPM parses .pc files
      # itself (PackageLoading/PkgConfig.swift) rather than shelling out for
      # that part, but it does still probe for a literal `pkg-config`
      # executable to discover built-in search paths — that probe degrades to
      # a diagnostic rather than a hard failure if the binary is absent, but
      # providing one is cheap and removes an unknown.
      #
      # Unlike the prior from-source build (which had no fetchable pkgconf
      # "tool" and needed one installed and copied to pkg-config.exe), the
      # gvsbuild asset ships bin/pkg-config.exe directly — confirmed present
      # in the archive. No copy/rename step needed.
      - name: Configure pkg-config for gvsbuild GTK 4
        shell: pwsh
        run: |
          $gtkBin = "C:\gtk-build\gtk\x64\release\bin"
          Add-Content $env:GITHUB_PATH $gtkBin
          Add-Content $env:GITHUB_ENV "PKG_CONFIG_PATH=C:\gtk-build\gtk\x64\release\lib\pkgconfig"

      # Same rationale as the macOS leg's cache step: a from-scratch compile of
      # swift-cross-ui's dependency closure is the dominant cost of this job
      # (Build (release) alone ran ~19 minutes with no cache), and Windows is
      # already the slower leg due to the toolchain/VS setup steps above.
      # Key extended with the pinned gvsbuild tag (spec CUESYNC-6 §C.13):
      # Package.resolved itself does not change for this ticket, so hashing it
      # alone can never invalidate this cache when the GTK version changes —
      # the pinned tag literal is the actual GTK input and must be bumped by
      # hand alongside the "Install GTK 4" step above whenever the pin moves.
      # spec CUESYNC-6c §2 step 7: also extended with the Swift toolchain
      # version — .swiftmodule files are compiler-version-locked, so a 6.1-built
      # .build tree must not be handed to the 6.3.3 compiler this job now installs.
      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: windows-build-spm-swift-6.3.3-gvsbuild-2026.6.0-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            windows-build-spm-swift-6.3.3-gvsbuild-2026.6.0-

      - name: Swift version
        run: swift --version

      # CI-observed (this branch, run 29576012144): swift-cross-ui v0.8.0
      # (the exact pin in Package.swift, commit
      # a6d206370812e3b9edba259d167e848892c5013d) fails to compile on
      # windows-latest with "cannot convert value of type 'UInt' to expected
      # argument type 'gulong'/'gsize'" in Sources/Gtk/GObject.swift (x3) and
      # Sources/Gtk/MemoryTexture.swift (x1). Root cause: those 4 call sites
      # pass a bare Swift `UInt` into GLib functions typed `gulong`/`gsize`.
      # On macOS/Linux (LP64) `unsigned long` is 64-bit, so ClangImporter
      # imports both `gulong` and `gsize` as `UInt` there and `UInt(...)`
      # already matches — that's why only the Windows (LLP64) legs fail:
      # there `unsigned long` is 32-bit, so `gulong` imports as `UInt32` and
      # `gsize` (backed by 64-bit `size_t`) imports as `UInt64`, neither of
      # which unifies with `UInt`.
      #
      # This is upstream swift-cross-ui code (github.com/moreSwift/swift-cross-ui),
      # not ours, and the version is pinned exactly per spec CUESYNC-5 §0.1 —
      # so the fix lives here, applied to the resolved checkout right before
      # it's compiled, rather than as an edit to a file we don't own. `swift
      # package resolve` (not the build step itself) is what materializes
      # .build/checkouts/swift-cross-ui, so it has to run first.
      #
      # The replacement text isn't invented: Signals.swift's own
      # `disconnectSignal(_:handlerId:)`, one function away from the first
      # broken call site, already does this identical conversion via
      # `.init(handlerId)` instead of `UInt(handlerId)` and compiles clean on
      # every platform — `.init` resolves to whichever concrete type the
      # parameter actually is. This step applies that same established idiom
      # to the 4 sites that still spell it out as `UInt(...)`, which keeps
      # the patch minimal and platform-agnostic (harmless on macOS/Linux too,
      # not Windows-only). Idempotent: a second run finds no remaining
      # `UInt(...)` call at these sites and is a no-op.
      #
      # CI-observed (this branch, run 29577493457): both windows-latest jobs
      # failed here — not on the UInt/gulong mismatch itself, but one step
      # earlier — with "Set-Content: Access to the path
      # '...\swift-cross-ui\Sources\Gtk\GObject.swift' is denied." SwiftPM
      # checks dependency sources out read-only on Windows, specifically so
      # nobody edits a pinned dependency by accident — which is exactly what
      # this step intentionally does, so the read-only flag has to be
      # cleared first. `Set-ItemProperty -Name IsReadOnly -Value $false`
      # flips it before each file is rewritten; idempotent like the rest of
      # this step, since clearing an already-clear flag is a no-op.
      - name: Resolve Swift package dependencies
        run: swift package resolve

      # CI-observed (this branch, run 29580303796): windows-test failed with
      # compile errors in .build\checkouts\swift-java\Plugins\JExtractSwiftPlugin
      # ("cannot find 'getEnvironmentBool' in scope", "cannot find type
      # 'SwiftJavaPluginProtocol' in scope", ...) while windows-build's
      # identical resolve of the identical pinned commit, in the same run,
      # compiled clean — so this isn't a real source problem, it's a checkout
      # race. swift-cross-ui unconditionally adds stackotter/swift-java as a
      # `.package` dependency whenever it isn't invoked by xcodebuild (its own
      # Package.swift: `androidBackendSupported = !invokedByXcode` for
      # compiler >=6.2) — not just on Android — so `swift build`/`swift test`
      # here always resolves and compiles swift-java's plugins
      # (JExtractSwiftPlugin, SwiftJavaPlugin, JavaCompilerPlugin) even though
      # CueSync only links GtkBackend.
      #
      # Each of those three plugin targets works around SwiftPM having no
      # native "shared sources between plugin targets" feature by symlinking
      # `_PluginsShared -> ../PluginsShared` into its own directory (verified
      # identical on the macOS checkout of the same pinned commit) — that's
      # where `getEnvironmentBool`/`SwiftJavaPluginProtocol`/etc. actually
      # live, so a broken link there produces exactly the "cannot find X in
      # scope" errors observed. Root cause: creating a Windows directory
      # symlink needs to know at creation time whether the target is a file or
      # a directory, and git's checkout (parallelized since Git 2.36) can
      # create the `_PluginsShared` link before `PluginsShared` itself exists
      # on disk — "JExtractSwiftPlugin" sorts before "PluginsShared", so this
      # is more likely than not to lose the race. Which side wins isn't
      # deterministic, which is exactly why the identical commit split
      # success/failure across windows-build and windows-test in one run.
      #
      # Fixed deterministically rather than retried: delete whatever git
      # produced at each `_PluginsShared` path and replace it with an NTFS
      # directory junction (not a symlink) pointing at the real
      # `Plugins/PluginsShared` — junctions need no special privilege to
      # create (unlike symlinks) and are transparent to directory
      # enumeration, so SwiftPM sees a normal, populated directory every time
      # regardless of how the git checkout raced. Idempotent: re-running
      # against an already-repaired link just replaces it with an equivalent
      # one.
      #
      # CUESYNC-6e: the above fixed only that one layer, by a hardcoded
      # 3-plugin list. swift-java shares plugin sources via git symlinks in
      # TWO nested layers:
      #   1. Plugins/<Plugin>/_PluginsShared -> ../PluginsShared        (outer)
      #   2. Plugins/PluginsShared/SwiftJavaConfigurationShared
      #                       -> ../../Sources/SwiftJavaConfigurationShared (nested)
      # `readConfiguration` lives behind layer #2
      # (Sources/SwiftJavaConfigurationShared/Configuration.swift), so a
      # broken layer #2 on Windows produces "cannot find 'readConfiguration'
      # in scope" even after layer #1 is repaired. This repairs EVERY git
      # symlink in the checkout generically: git's index is the source of
      # truth for which tracked entries are symlinks (mode 120000),
      # regardless of how Windows materialized them (broken reparse point /
      # plain text file / raced dir). Directory targets become privilege-free
      # NTFS junctions (transparent to enumeration, which is why junctions
      # already fixed layer #1); file targets (none known today) become
      # hardlinks. Idempotent: a second pass deletes the junction/hardlink it
      # made and recreates an equivalent one.
      - name: Repair swift-java Windows symlinks (all layers, generic; pinned via Package.resolved 0.5.1)
        shell: pwsh
        run: |
          $repo = ".build\checkouts\swift-java"
          if (-not (Test-Path -LiteralPath $repo)) {
            Write-Error "swift-java checkout not found at $repo — did 'swift package resolve' run?"; exit 1
          }
          $entries = & git -c core.quotePath=false -C $repo ls-files -s
          if ($LASTEXITCODE -ne 0) { Write-Error "git ls-files failed in $repo"; exit 1 }

          $repaired = 0
          foreach ($entry in $entries) {
            # "<mode> <sha> <stage>\t<path>" — keep symlinks only
            if ($entry -notmatch '^120000\s+([0-9a-f]{40})\s+\d+\t(.+)$') { continue }
            $blobSha = $Matches[1]; $relPath = $Matches[2]

            $linkFull = [System.IO.Path]::GetFullPath((Join-Path $repo $relPath))
            $linkDir  = Split-Path -Parent $linkFull

            $target = (& git -C $repo cat-file blob $blobSha | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($target)) {
              Write-Error "could not read symlink target for $relPath"; exit 1
            }
            $targetAbs = [System.IO.Path]::GetFullPath([System.IO.Path]::Combine($linkDir, $target))
            if (-not (Test-Path -LiteralPath $targetAbs)) {
              Write-Error "symlink $relPath -> $targetAbs : target does not exist on disk"; exit 1
            }

            $existing = Get-Item -LiteralPath $linkFull -Force -ErrorAction SilentlyContinue
            if ($existing) {
              if ($existing.Attributes.HasFlag([System.IO.FileAttributes]::ReparsePoint)) {
                Remove-Item -LiteralPath $linkFull -Force
              } elseif ($existing.PSIsContainer) {
                Remove-Item -LiteralPath $linkFull -Recurse -Force
              } else {
                Remove-Item -LiteralPath $linkFull -Force
              }
            }

            if (Test-Path -LiteralPath $targetAbs -PathType Container) {
              New-Item -ItemType Junction -Path $linkFull -Target $targetAbs | Out-Null
              Write-Host "junction: $relPath -> $targetAbs"
            } else {
              New-Item -ItemType HardLink -Path $linkFull -Target $targetAbs | Out-Null
              Write-Host "hardlink: $relPath -> $targetAbs"
            }
            $repaired++
          }

          if ($repaired -eq 0) {
            Write-Error "no git symlinks (mode 120000) found under $repo — enumeration is broken; refusing to proceed silently"; exit 1
          }
          Write-Host "repaired $repaired swift-java symlink(s)"

      - name: Patch swift-cross-ui Windows gulong/gsize mismatch (pinned v0.8.0)
        shell: pwsh
        run: |
          $gobject = ".build\checkouts\swift-cross-ui\Sources\Gtk\GObject.swift"
          Set-ItemProperty -LiteralPath $gobject -Name IsReadOnly -Value $false
          (Get-Content -Raw -LiteralPath $gobject) `
            -replace 'g_signal_handler_disconnect\(gobjectPointer, id\)', 'g_signal_handler_disconnect(gobjectPointer, .init(id))' `
            -replace 'g_signal_handler_block\(gobjectPointer, signalID\)', 'g_signal_handler_block(gobjectPointer, .init(signalID))' `
            -replace 'g_signal_handler_unblock\(gobjectPointer, signalID\)', 'g_signal_handler_unblock(gobjectPointer, .init(signalID))' |
            Set-Content -NoNewline -LiteralPath $gobject -Encoding utf8NoBOM

          $memoryTexture = ".build\checkouts\swift-cross-ui\Sources\Gtk\MemoryTexture.swift"
          Set-ItemProperty -LiteralPath $memoryTexture -Name IsReadOnly -Value $false
          (Get-Content -Raw -LiteralPath $memoryTexture) `
            -replace 'g_bytes_new\(rgbaData, UInt\(rgbaData\.count\)\)', 'g_bytes_new(rgbaData, .init(rgbaData.count))' |
            Set-Content -NoNewline -LiteralPath $memoryTexture -Encoding utf8NoBOM

      - name: Build (release)
        run: swift build -c release

      # spec §D.17: bundle the GTK 4 runtime (and its transitive closure —
      # glib, cairo, pango, harfbuzz, gdk-pixbuf, graphene, fribidi, libepoxy,
      # the image codecs, intl, zlib and friends) next to CueSync.exe so the
      # uploaded cuesync-windows artifact is self-contained. Copy everything
      # gvsbuild placed in the extracted tree's bin/ rather than hand-curating
      # the list — the §D.18 closure check below is what tells us what's
      # actually required.
      - name: Bundle GTK 4 runtime DLLs next to CueSync.exe
        shell: pwsh
        run: |
          Get-ChildItem C:\gtk-build\gtk\x64\release\bin -File |
            Where-Object { $_.Extension -eq '.dll' } |
            Copy-Item -Destination .build\release\ -Force

      # spec §0.6/§D.18 — the dependency-checking tool: marcoesposito1988/
      # dependency_runner's `wldd` ("ldd for Windows"), corrected from the
      # ticket's conflated owner/binary name per findings doc §0.6. Its
      # release assets publish no checksums, so — per spec §4 — the SHA-256 is
      # computed once here and verified BEFORE extraction, not after.
      - name: Install dependency-closure checker (wldd v1.5.0, pinned)
        shell: pwsh
        run: |
          $wlddZip = "$env:RUNNER_TEMP\wldd.zip"
          Invoke-WebRequest -Uri "https://github.com/marcoesposito1988/dependency_runner/releases/download/v1.5.0/wldd-x86_64-pc-windows-msvc.zip" -OutFile $wlddZip
          $expectedSha256 = "2DFB5102A00D5E6A368F2A5E0F78733B9EFD7D629B4E90952F3759625971D016"
          $actualSha256 = (Get-FileHash $wlddZip -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            Write-Error "wldd.zip checksum mismatch: expected $expectedSha256, got $actualSha256"
            exit 1
          }
          Expand-Archive -Path $wlddZip -DestinationPath "$env:RUNNER_TEMP\wldd" -Force
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\wldd"

      # spec §D.18/§D.19 — the closure check itself, plus its mandatory
      # negative control. Contract (§D.18): resolve CueSync.exe's transitive
      # import closure via the real Windows DLL search order; fail the job on
      # any unresolved DLL, or any non-system DLL resolved from outside the
      # artifact directory. The system allowlist is the narrow, explicit list
      # below — no wildcard beyond the spec-sanctioned `api-ms-win-*` family.
      # `wldd` itself always exits 0 (it is an inspection tool, not a gate —
      # confirmed by reading its source), so the gating is done here by
      # parsing its `name => path` / `name => not found` output, matching
      # spec §D.18's "fails the job" requirement rather than trusting an exit
      # code nobody would otherwise inspect.
      #
      # The Swift runtime DLLs (swiftCore.dll, Foundation.dll, dispatch.dll,
      # BlocksRuntime.dll, ...) are deliberately NOT in the system allowlist
      # and are NOT bundled — spec §D.18 forbids allowlisting them into
      # silence, and this ticket leaves bundling them genuinely out of scope.
      # That gap is real and is the next ticket's work — but it must not be
      # confused with the thing this check actually guards against (a wrong
      # or missing dependency resolving from an arbitrary/untrusted
      # location). CI-observed (this branch, run 29580303796): the clean run
      # failed with "non-system DLL resolved outside the artifact directory:
      # swiftCRT.dll => C:\Users\runneradmin\...\Swift\Runtimes\6.3.3\usr\bin\
      # swiftCRT.dll" — every Swift runtime/toolchain DLL resolved via PATH
      # trips the same check as a genuinely unexpected DLL would, so the
      # check never actually passed. Tracking the gap (not silencing it)
      # means recognizing DLLs resolved from the Swift install root as that
      # known, logged, non-bundled dependency — distinct from the strict
      # system allowlist — while still failing on anything from anywhere
      # else. The root is derived from `swift.exe`'s own resolved path
      # (compnerd/gha-setup-swift installs under
      # `<LOCALAPPDATA>\Programs\Swift\{Toolchains,Runtimes}\...`) rather
      # than hardcoded, since the exact version/edition segment varies.
      #
      # §D.19: a check that passes proves nothing until watched to fail for
      # the right reason. This step removes one bundled DLL, re-runs the
      # check and asserts it FAILS, restores the DLL, then re-runs once more
      # and asserts it PASSES again.
      - name: Verify DLL closure (clean run, then negative control)
        shell: pwsh
        run: |
          # CI-observed (this branch, run 29605824014): now that the symlink
          # repair (CUESYNC-6e) gets the build past swift-java, the clean run
          # reaches this check for the first time and fails on "non-system DLL
          # resolved outside the artifact directory: dcomp.dll =>
          # C:\Windows\System32\dcomp.dll". dcomp.dll (DirectComposition) is a
          # bona fide Windows system component — present in System32 on every
          # supported Windows release — pulled in transitively by GTK4's
          # Windows GDI/ANGLE compositing path, exactly like dwmapi.dll and
          # comctl32.dll already on this list. Adding it here, not routing it
          # through the Swift-toolchain-root branch, which is reserved for the
          # separate known gap of unbundled Swift runtime DLLs.
          #
          # CI-observed (this branch, run 29607447687): with dcomp.dll
          # allowed, the clean run advanced further into wldd's dependency
          # list and failed again, this time on d3d12.dll =>
          # C:\Windows\System32\D3D12.dll. Write-Error is terminating in this
          # step (no explicit -ErrorAction override, and the pwsh runner here
          # defaults $ErrorActionPreference to Stop), so Test-DllClosure halts
          # at the FIRST disallowed name it hits and every failure after it in
          # wldd's output is invisible until the one before it is fixed — that
          # is why these CI-fix rounds were surfacing one DLL at a time. Rather
          # than repeat that one-DLL-per-~23-minute-round cycle, the full raw
          # `== Dependency-closure check (clean) ==` dump from this same run
          # was read end to end and checked by hand against the allow list
          # below; every remaining name that resolves under
          # C:\Windows\System32\ and was not already covered is added in this
          # one pass. All are bona fide Windows system components present on
          # every supported Windows release, pulled in transitively by GTK4's
          # Windows rendering/text/network stack (ANGLE's Direct3D/DXGI/GDI
          # path, DirectWrite/Uniscribe text shaping, RPC, Winsock-adjacent
          # network info, and the VC++ redistributable runtime) — none
          # resolved from an unexpected or non-system location.
          $allow = @(
            'kernel32.dll','user32.dll','gdi32.dll','advapi32.dll','ole32.dll',
            'oleaut32.dll','shell32.dll','shlwapi.dll','ws2_32.dll','ucrtbase.dll',
            'msvcrt.dll','ntdll.dll','crypt32.dll','bcrypt.dll','version.dll',
            'winmm.dll','dwmapi.dll','comctl32.dll','comdlg32.dll','imm32.dll',
            'setupapi.dll','dcomp.dll','d3d11.dll','d3d12.dll','dxgi.dll',
            'opengl32.dll','hid.dll','winspool.drv','kernelbase.dll','dwrite.dll',
            'iphlpapi.dll','usp10.dll','dnsapi.dll','userenv.dll','secur32.dll',
            'dbghelp.dll','rpcrt4.dll','msvcp140.dll','msimg32.dll',
            'vcruntime140.dll','vcruntime140_1.dll','api-ms-win-*'
          )
          # CI-observed (this branch, run 29578635669): the clean run failed on
          # "non-system DLL resolved outside the artifact directory:
          # pango-1.0-0.dll => ...\.build\x86_64-unknown-windows-msvc\release\
          # pango-1.0-0.dll" — a bundled GTK DLL the "Bundle GTK 4 runtime
          # DLLs" step above copied straight into `.build\release\`. Root
          # cause: SwiftPM creates `.build\release` on Windows as a junction
          # to `.build\<triple>\release`, not a real directory. Windows' own
          # path-resolution APIs (which `wldd` uses to report each
          # dependency's location) follow that junction to its real target,
          # so wldd's output names the triple-qualified path — but
          # `Resolve-Path` does not follow reparse points, so `$artifactDir`
          # was still the untranslated junction path and never matched,
          # failing every bundled DLL's containment check. Resolving the
          # junction's final target first (falling back to the plain
          # resolved path when `.build\release` isn't a reparse point at all)
          # makes `$artifactDir` match the same canonical path wldd reports.
          $artifactItem = Get-Item ".build\release"
          $resolvedTarget = $artifactItem.ResolveLinkTarget($true)
          $artifactDir = if ($resolvedTarget) { $resolvedTarget.FullName } else { $artifactItem.FullName }

          # See the "Verify DLL closure" step comment above: only trust this
          # root if it was actually derived from a resolved swift.exe path —
          # an empty/missing match must NOT fall back to matching everything.
          $swiftToolchainRoot = $null
          $swiftExe = Get-Command swift.exe -ErrorAction SilentlyContinue
          if ($swiftExe) {
            $swiftRootMatch = [regex]::Match($swiftExe.Source, '^.+\\Swift(?=\\(Toolchains|Runtimes)\\)')
            if ($swiftRootMatch.Success) { $swiftToolchainRoot = $swiftRootMatch.Value }
          }

          # CI-observed (this branch, run 29610922066): the clean run passed (proving
          # the allow-list above is now complete) but the negative control crashed
          # instead of confirming — a "Test-DllClosure: ... non-system DLL resolved
          # outside the artifact directory: pango-1.0-0.dll => C:\gtk-build\gtk\x64\
          # release\bin\pango-1.0-0.dll" script-terminating error, never reaching the
          # `if (Test-DllClosure ...) { throw "negative control failed..." }` check
          # below it, so the DLL was never restored and the intended pass/fail
          # message never printed. Root cause: this pwsh runner defaults
          # $ErrorActionPreference to Stop (see the "Write-Error is terminating"
          # comment above), so a bare `Write-Error` inside a function is a
          # *terminating* error that unwinds out of the function entirely rather
          # than logging and letting execution continue — exactly the behavior that
          # comment already diagnosed as forcing these CI-fix rounds to surface one
          # disallowed DLL at a time. It went unnoticed on every prior clean run
          # because the loop always reached the end of `$lines` without hitting a
          # disallowed name; the negative control is the first path guaranteed to
          # hit one (it removes a DLL from the artifact directory specifically so
          # the closure check finds it resolved from somewhere else instead), which
          # is why it's what finally exposed this. `-ErrorAction Continue` makes
          # `Write-Error` log and continue instead of unwinding, regardless of the
          # runner's global preference, so the loop finishes checking every
          # remaining dependency (surfacing every violation in one pass, not just
          # the first) and `return -not $failed` executes normally either way.
          function Test-DllClosure {
            param([string]$exePath)
            $lines = & wldd $exePath
            $lines | ForEach-Object { Write-Host $_ }
            $failed = $false
            foreach ($rawLine in $lines) {
              $trimmedLine = $rawLine.Trim()
              if ($trimmedLine.EndsWith(' => not found')) {
                $notFoundName = $trimmedLine.Substring(0, $trimmedLine.Length - ' => not found'.Length).Trim('"')
                if ($notFoundName -like 'api-ms-win-*') {
                  # API Set forwarder stubs are resolved by the OS loader via the
                  # apiset schema at runtime, not via a filesystem lookup, so a
                  # static walker like wldd can never find a file for them —
                  # this is expected and not a real missing dependency.
                  Write-Host "API Set stub (resolved at runtime via apiset schema, not the filesystem): $trimmedLine"
                  continue
                }
                Write-Error "unresolved dependency: $trimmedLine" -ErrorAction Continue
                $failed = $true
                continue
              }
              $separatorIndex = $trimmedLine.IndexOf(' => ')
              if ($separatorIndex -gt 0) {
                $name = $trimmedLine.Substring(0, $separatorIndex).Trim()
                $path = $trimmedLine.Substring($separatorIndex + 4).Trim()
                $isInsideArtifact = $path.StartsWith($artifactDir, [System.StringComparison]::OrdinalIgnoreCase)
                $isAllowedSystemDll = [bool]($allow | Where-Object { $name -like $_ })
                $isFromSwiftToolchain = $swiftToolchainRoot -and $path.StartsWith($swiftToolchainRoot, [System.StringComparison]::OrdinalIgnoreCase)
                if ($isFromSwiftToolchain) {
                  Write-Host "known gap, not bundled (spec CUESYNC-6d/CUESYNC-6 §D.18, next ticket's work): $name => $path"
                } elseif (-not $isInsideArtifact -and -not $isAllowedSystemDll) {
                  Write-Error "non-system DLL resolved outside the artifact directory: $name => $path" -ErrorAction Continue
                  $failed = $true
                }
              }
            }
            return -not $failed
          }

          Write-Host "== Dependency-closure check (clean) =="
          if (-not (Test-DllClosure ".build\release\CueSync.exe")) { throw "clean dependency-closure check failed" }
          Write-Host "Closure check passed: no missing or non-system DLL found outside the artifact directory."

          # CI-observed (this branch, run 29609242832): the negative control failed —
          # "the closure check still passed with abseil_dll.dll removed". Picking the
          # alphabetically-first .dll file in the artifact directory can land on a DLL
          # that the "Bundle GTK 4 runtime DLLs" step copied over from gvsbuild's bin/
          # but that CueSync.exe's own resolved import closure never references (wldd's
          # static PE-import walk of CueSync.exe never reaches abseil_dll.dll) — removing
          # a DLL nothing imports can never make the closure check fail, so the negative
          # control was vacuous. The victim must instead be a name wldd's own clean-run
          # walk actually resolved from inside the artifact directory — i.e. a real,
          # exercised dependency — so removing it is guaranteed to break the closure.
          $victimDll = $null
          foreach ($rawLine in (& wldd ".build\release\CueSync.exe")) {
            $trimmedLine = $rawLine.Trim()
            $separatorIndex = $trimmedLine.IndexOf(' => ')
            if ($separatorIndex -le 0) { continue }
            $depName = $trimmedLine.Substring(0, $separatorIndex).Trim()
            $depPath = $trimmedLine.Substring($separatorIndex + 4).Trim()
            if ($depPath.StartsWith($artifactDir, [System.StringComparison]::OrdinalIgnoreCase)) {
              $victimDll = [System.IO.Path]::GetFileNameWithoutExtension($depName)
              break
            }
          }
          if (-not $victimDll) { Write-Error "no bundled DLL found in CueSync.exe's resolved dependency closure to use for the negative control"; exit 1 }

          Write-Host "== Negative control: removing $victimDll.dll =="
          Copy-Item ".build\release\$victimDll.dll" "$env:RUNNER_TEMP\$victimDll.dll.bak" -Force
          Remove-Item ".build\release\$victimDll.dll" -Force

          if (Test-DllClosure ".build\release\CueSync.exe") {
            throw "negative control failed: the closure check still passed with $victimDll.dll removed"
          }
          Write-Host "Negative control confirmed: the check correctly failed with $victimDll.dll removed."

          Write-Host "== Restoring $victimDll.dll =="
          Copy-Item "$env:RUNNER_TEMP\$victimDll.dll.bak" ".build\release\$victimDll.dll" -Force

          if (-not (Test-DllClosure ".build\release\CueSync.exe")) {
            throw "closure check still fails after restoring $victimDll.dll"
          }
          Write-Host "Closure check passes again after restoring the DLL."

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cuesync-windows
          path: .build/release/
          if-no-files-found: ignore

  windows-test:
    name: swift · windows-latest (test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup VS Dev Environment
        uses: seanmiddleditch/gha-setup-vsdevenv@cf96bf5b227cac6af28c04c4a4e69286ea444163 # v5

      # spec CUESYNC-6c §2 step 6: retry the toolchain install once on a
      # transient failure — see windows-build's identical comment above for
      # why continue-on-error/outcome/no-continue-on-error-on-retry all matter.
      - id: swift-install
        continue-on-error: true
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # v0.4.0
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - name: Retry Swift toolchain install
        if: steps.swift-install.outcome == 'failure'
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # v0.4.0
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      # CI-observed (this branch, run 29549794499): `swift test` invoked bare
      # builds the WHOLE package manifest first — including the `CueSync`
      # executable target, which depends on GtkBackend/swift-cross-ui — not
      # just CueSyncCoreTests' own dependency subset. This job used to skip
      # installing GTK 4 on the theory that `swift test` only builds what the
      # test target needs; that's wrong on every platform (confirmed locally
      # on macOS too: `swift build --build-tests`/`swift test` always builds
      # every target in the manifest, and `swift build --target
      # CueSyncCoreTests` alone compiles the test module but never performs
      # the final link into a runnable test binary — there's no SwiftPM CLI
      # flag that scopes both compiling AND linking to one target's actual
      # dependency subset). So this job needs the same GTK 4 install as
      # windows-build. Identical gvsbuild pin as windows-build's own "Install
      # GTK 4 (gvsbuild, pinned)" step below — see its comments for the tag/
      # SHA-256/prefix rationale (spec CUESYNC-6d).
      #
      # Identical rationale as windows-build's identically named step.
      - name: Install GTK 4 (gvsbuild, pinned)
        shell: pwsh
        run: |
          $gtkZip = "$env:RUNNER_TEMP\gtk4-gvsbuild.zip"
          Invoke-WebRequest -Uri "https://github.com/wingtk/gvsbuild/releases/download/2026.6.0/GTK4_Gvsbuild_2026.6.0_x64.zip" -OutFile $gtkZip
          $expectedSha256 = "01DBF613DE732A42BEDB425F034B84381970A652CEF6C0B3906E4DA1A6C18600"
          $actualSha256 = (Get-FileHash $gtkZip -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            Write-Error "gtk4-gvsbuild.zip checksum mismatch: expected $expectedSha256, got $actualSha256"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "C:\gtk-build\gtk\x64\release" | Out-Null
          Expand-Archive -Path $gtkZip -DestinationPath "C:\gtk-build\gtk\x64\release" -Force

          # Identical rationale as windows-build's identically named step —
          # see its comments for why this is required (SwiftPM's PkgConfig.swift
          # misparses `prefix=C:/...`'s drive-letter colon as a `key: value`
          # line and silently drops it, breaking every ${prefix}-derived path).
          Get-ChildItem -Path "C:\gtk-build\gtk\x64\release\lib\pkgconfig" -File |
            Where-Object { $_.Extension -eq '.pc' } | ForEach-Object {
            $pcContent = Get-Content -Raw -LiteralPath $_.FullName
            $pcPatched = $pcContent -replace '(?m)^prefix=.*', 'prefix=${pcfiledir}/../..'
            [System.IO.File]::WriteAllText($_.FullName, $pcPatched, [System.Text.UTF8Encoding]::new($false))
          }

      # Identical rationale as windows-build's identically named step.
      - name: Configure pkg-config for gvsbuild GTK 4
        shell: pwsh
        run: |
          $gtkBin = "C:\gtk-build\gtk\x64\release\bin"
          Add-Content $env:GITHUB_PATH $gtkBin
          Add-Content $env:GITHUB_ENV "PKG_CONFIG_PATH=C:\gtk-build\gtk\x64\release\lib\pkgconfig"

      # Keyed separately from windows-build's SwiftPM cache: even though both
      # jobs now build the same full package graph, they run on separate
      # runners with independent .build directories, so sharing one cache key
      # between them would just thrash (each job's save would evict the
      # other's). spec CUESYNC-6c §2 step 7: extended with the Swift toolchain
      # version — see windows-build's identical cache comment for why.
      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: windows-test-spm-swift-6.3.3-gvsbuild-2026.6.0-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            windows-test-spm-swift-6.3.3-gvsbuild-2026.6.0-

      - name: Swift version
        run: swift --version

      # Identical rationale as windows-build's identically named steps —
      # swift-cross-ui v0.8.0's Sources/Gtk/GObject.swift and
      # MemoryTexture.swift fail to compile on windows-latest with a
      # UInt→gulong/gsize conversion error, and this job compiles the same
      # full package graph (see the "swift test ... builds the WHOLE package
      # manifest" comment on the GTK 4 install step above), so it needs the
      # same patch applied before "Test" runs.
      - name: Resolve Swift package dependencies
        run: swift package resolve

      # CI-observed (this branch, run 29580303796): windows-test failed with
      # compile errors in .build\checkouts\swift-java\Plugins\JExtractSwiftPlugin
      # ("cannot find 'getEnvironmentBool' in scope", "cannot find type
      # 'SwiftJavaPluginProtocol' in scope", ...) while windows-build's
      # identical resolve of the identical pinned commit, in the same run,
      # compiled clean — so this isn't a real source problem, it's a checkout
      # race. swift-cross-ui unconditionally adds stackotter/swift-java as a
      # `.package` dependency whenever it isn't invoked by xcodebuild (its own
      # Package.swift: `androidBackendSupported = !invokedByXcode` for
      # compiler >=6.2) — not just on Android — so `swift build`/`swift test`
      # here always resolves and compiles swift-java's plugins
      # (JExtractSwiftPlugin, SwiftJavaPlugin, JavaCompilerPlugin) even though
      # CueSync only links GtkBackend.
      #
      # Each of those three plugin targets works around SwiftPM having no
      # native "shared sources between plugin targets" feature by symlinking
      # `_PluginsShared -> ../PluginsShared` into its own directory (verified
      # identical on the macOS checkout of the same pinned commit) — that's
      # where `getEnvironmentBool`/`SwiftJavaPluginProtocol`/etc. actually
      # live, so a broken link there produces exactly the "cannot find X in
      # scope" errors observed. Root cause: creating a Windows directory
      # symlink needs to know at creation time whether the target is a file or
      # a directory, and git's checkout (parallelized since Git 2.36) can
      # create the `_PluginsShared` link before `PluginsShared` itself exists
      # on disk — "JExtractSwiftPlugin" sorts before "PluginsShared", so this
      # is more likely than not to lose the race. Which side wins isn't
      # deterministic, which is exactly why the identical commit split
      # success/failure across windows-build and windows-test in one run.
      #
      # Fixed deterministically rather than retried: delete whatever git
      # produced at each `_PluginsShared` path and replace it with an NTFS
      # directory junction (not a symlink) pointing at the real
      # `Plugins/PluginsShared` — junctions need no special privilege to
      # create (unlike symlinks) and are transparent to directory
      # enumeration, so SwiftPM sees a normal, populated directory every time
      # regardless of how the git checkout raced. Idempotent: re-running
      # against an already-repaired link just replaces it with an equivalent
      # one.
      #
      # CUESYNC-6e: the above fixed only that one layer, by a hardcoded
      # 3-plugin list. swift-java shares plugin sources via git symlinks in
      # TWO nested layers:
      #   1. Plugins/<Plugin>/_PluginsShared -> ../PluginsShared        (outer)
      #   2. Plugins/PluginsShared/SwiftJavaConfigurationShared
      #                       -> ../../Sources/SwiftJavaConfigurationShared (nested)
      # `readConfiguration` lives behind layer #2
      # (Sources/SwiftJavaConfigurationShared/Configuration.swift), so a
      # broken layer #2 on Windows produces "cannot find 'readConfiguration'
      # in scope" even after layer #1 is repaired. This repairs EVERY git
      # symlink in the checkout generically: git's index is the source of
      # truth for which tracked entries are symlinks (mode 120000),
      # regardless of how Windows materialized them (broken reparse point /
      # plain text file / raced dir). Directory targets become privilege-free
      # NTFS junctions (transparent to enumeration, which is why junctions
      # already fixed layer #1); file targets (none known today) become
      # hardlinks. Idempotent: a second pass deletes the junction/hardlink it
      # made and recreates an equivalent one.
      - name: Repair swift-java Windows symlinks (all layers, generic; pinned via Package.resolved 0.5.1)
        shell: pwsh
        run: |
          $repo = ".build\checkouts\swift-java"
          if (-not (Test-Path -LiteralPath $repo)) {
            Write-Error "swift-java checkout not found at $repo — did 'swift package resolve' run?"; exit 1
          }
          $entries = & git -c core.quotePath=false -C $repo ls-files -s
          if ($LASTEXITCODE -ne 0) { Write-Error "git ls-files failed in $repo"; exit 1 }

          $repaired = 0
          foreach ($entry in $entries) {
            # "<mode> <sha> <stage>\t<path>" — keep symlinks only
            if ($entry -notmatch '^120000\s+([0-9a-f]{40})\s+\d+\t(.+)$') { continue }
            $blobSha = $Matches[1]; $relPath = $Matches[2]

            $linkFull = [System.IO.Path]::GetFullPath((Join-Path $repo $relPath))
            $linkDir  = Split-Path -Parent $linkFull

            $target = (& git -C $repo cat-file blob $blobSha | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($target)) {
              Write-Error "could not read symlink target for $relPath"; exit 1
            }
            $targetAbs = [System.IO.Path]::GetFullPath([System.IO.Path]::Combine($linkDir, $target))
            if (-not (Test-Path -LiteralPath $targetAbs)) {
              Write-Error "symlink $relPath -> $targetAbs : target does not exist on disk"; exit 1
            }

            $existing = Get-Item -LiteralPath $linkFull -Force -ErrorAction SilentlyContinue
            if ($existing) {
              if ($existing.Attributes.HasFlag([System.IO.FileAttributes]::ReparsePoint)) {
                Remove-Item -LiteralPath $linkFull -Force
              } elseif ($existing.PSIsContainer) {
                Remove-Item -LiteralPath $linkFull -Recurse -Force
              } else {
                Remove-Item -LiteralPath $linkFull -Force
              }
            }

            if (Test-Path -LiteralPath $targetAbs -PathType Container) {
              New-Item -ItemType Junction -Path $linkFull -Target $targetAbs | Out-Null
              Write-Host "junction: $relPath -> $targetAbs"
            } else {
              New-Item -ItemType HardLink -Path $linkFull -Target $targetAbs | Out-Null
              Write-Host "hardlink: $relPath -> $targetAbs"
            }
            $repaired++
          }

          if ($repaired -eq 0) {
            Write-Error "no git symlinks (mode 120000) found under $repo — enumeration is broken; refusing to proceed silently"; exit 1
          }
          Write-Host "repaired $repaired swift-java symlink(s)"

      - name: Patch swift-cross-ui Windows gulong/gsize mismatch (pinned v0.8.0)
        shell: pwsh
        run: |
          $gobject = ".build\checkouts\swift-cross-ui\Sources\Gtk\GObject.swift"
          Set-ItemProperty -LiteralPath $gobject -Name IsReadOnly -Value $false
          (Get-Content -Raw -LiteralPath $gobject) `
            -replace 'g_signal_handler_disconnect\(gobjectPointer, id\)', 'g_signal_handler_disconnect(gobjectPointer, .init(id))' `
            -replace 'g_signal_handler_block\(gobjectPointer, signalID\)', 'g_signal_handler_block(gobjectPointer, .init(signalID))' `
            -replace 'g_signal_handler_unblock\(gobjectPointer, signalID\)', 'g_signal_handler_unblock(gobjectPointer, .init(signalID))' |
            Set-Content -NoNewline -LiteralPath $gobject -Encoding utf8NoBOM

          $memoryTexture = ".build\checkouts\swift-cross-ui\Sources\Gtk\MemoryTexture.swift"
          Set-ItemProperty -LiteralPath $memoryTexture -Name IsReadOnly -Value $false
          (Get-Content -Raw -LiteralPath $memoryTexture) `
            -replace 'g_bytes_new\(rgbaData, UInt\(rgbaData\.count\)\)', 'g_bytes_new(rgbaData, .init(rgbaData.count))' |
            Set-Content -NoNewline -LiteralPath $memoryTexture -Encoding utf8NoBOM

      # On Windows, `swift test` spawns BOTH the XCTest runner and the
      # swift-testing runner. The swift-testing runner finds 0 tests (the suite
      # is XCTest) and exits non-zero even when every XCTest passes — a spurious
      # failure. So we gate on the XCTest result: fail only if XCTest reports an
      # actual failure; the "0 tests" swift-testing exit is ignored.
      #
      # CI-observed (this branch and adw/CUESYNC-6, both runs): assigning the
      # whole pipeline directly to $out — `$out = swift test ... | Out-String`
      # — captures every line into the variable and prints NONE of it, because
      # output bound to an assignment never reaches the success stream. That
      # made every past failure here show up as a bare "no XCTest summary was
      # found" with the actual compiler/test output nowhere in the log. Run
      # the pipeline as its own statement instead so Tee-Object's pass-through
      # still reaches the host (and therefore the Action log) while $log keeps
      # the same capture the regex below needs.
      - name: Test
        shell: pwsh
        run: |
          swift test -c release 2>&1 | Tee-Object -Variable log
          $out = $log | Out-String
          if ($out -match "with (\d+) failures") {
            $fails = [int]$Matches[1]
            if ($fails -gt 0) { Write-Error "XCTest reported $fails failure(s)"; exit 1 }
            Write-Host "All XCTest tests passed ($fails failures)."
            exit 0
          }
          # No XCTest summary line found — surface the real exit for diagnosis.
          if ($LASTEXITCODE -ne 0) { Write-Error "swift test failed and no XCTest summary was found"; exit 1 }
