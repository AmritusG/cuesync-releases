# Copy to `.github/workflows/swift-windows.yml` in the app you're porting.
# Compiles the Swift port on a REAL Windows x64 runner (and macOS) so the build
# is verified where you can't compile locally. Download the built artifact from
# the run's "Artifacts" section.
#
# Design notes (why this is split per-OS):
#   * macOS runners ship Xcode + Swift preinstalled — installing a second
#     toolchain is unnecessary and was breaking the build. So macOS just uses
#     the built-in `swift`.
#   * Windows has no bundled Swift. We install it with compnerd's action, which
#     sets up the toolchain + Windows SDK. A flaky signature check on swift.org
#     can 404; pin the tag to a release whose windows package is known-good.
name: swift-windows

on:
  push:
    branches: [main, "adw/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # -------- macOS: use the preinstalled toolchain, no setup action --------
  macos:
    name: swift · macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (release)
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuesync-macos
          path: .build/release/
          if-no-files-found: ignore

  # -------- Windows x64: install Swift, then build --------
  windows:
    name: swift · windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the Swift toolchain + Windows SDK. Pinned to 6.1 because the
      # 6.0.3 Windows installer on swift.org ships WITHOUT a `.sig` signature
      # file, so signature-verifying setup actions refuse it ("No signature
      # at .../swift-6.0.3-RELEASE-windows10.exe.sig"). 6.1's Windows package is
      # signed. Bump only to another release whose windows .exe.sig exists.
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.1"

      - name: Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuesync-windows
          path: .build/release/
          if-no-files-found: ignore
