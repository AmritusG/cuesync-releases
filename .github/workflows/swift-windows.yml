# Copy to `.github/workflows/swift-windows.yml` in the app you're porting.
# Compiles the Swift port on a REAL Windows x64 runner (and macOS) so the build
# is verified where you can't compile locally. Download the built artifact from
# the run's "Artifacts" section.
#
# Design notes (why this is split per-OS):
#   * macOS runners ship Xcode + Swift preinstalled — installing a second
#     toolchain is unnecessary and was breaking the build. So macOS just uses
#     the built-in `swift`.
#   * Windows has no bundled Swift. We install it with compnerd's action, which
#     sets up the toolchain + Windows SDK. A flaky signature check on swift.org
#     can 404; pin the tag to a release whose windows package is known-good.
name: swift-windows

on:
  push:
    branches: [main, "adw/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # -------- macOS: use the preinstalled toolchain, no setup action --------
  macos:
    name: swift · macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # swift-cross-ui's own dependency closure (swift-syntax macros, WinUI/image
      # codec targets, etc. — CUESYNC-5 §0) compiles from absolute zero on every
      # push with no cache, which by itself was pushing "Build (release)" past
      # 15 minutes and total job time past the 1800s ceiling. Caching `.build`
      # keyed on Package.resolved means only a changed manifest re-triggers a
      # full rebuild; unrelated commits hit a warm cache.
      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: macos-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            macos-spm-

      - name: Swift version
        run: swift --version
      - name: Build (release)
        run: swift build -c release
      # -c release: reuses the object files "Build (release)" just produced
      # instead of triggering a second, fully separate debug compile of the
      # whole dependency graph (swift-cross-ui, swift-syntax macros, CSQLite,
      # CZlib) — that redundant double-build is what was pushing total CI
      # time past the 1800s ceiling.
      - name: Test
        run: swift test -c release
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cuesync-macos
          path: .build/release/
          if-no-files-found: ignore

  # -------- Windows x64: install Swift, then build --------
  #
  # Split into two independent jobs (build / test) instead of one sequential
  # job. `CueSyncCoreTests` depends only on CueSyncCore/CSQLite/CZlib (see
  # Package.swift) — never on the CueSync executable target, which is what
  # pulls in swift-cross-ui's whole dependency closure (swift-syntax macros,
  # WinUI projections, image codecs). That closure is what made "Build
  # (release)" alone take ~19 minutes with a cold cache; running it after Test
  # serialized the two into ~30 minutes in a single job, over the 1800s
  # ceiling. Since GitHub Actions already runs jobs without a `needs:` edge in
  # parallel, giving build and test their own jobs lets the ~10-minute test
  # job finish alongside the ~19-minute build job instead of after it — the
  # toolchain/VS setup steps are duplicated, but that's a couple of minutes,
  # not the ~10 minutes this saves off the critical path.
  windows-build:
    name: swift · windows-latest (build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # swift-cross-ui's WinUIBackend (CUESYNC-5) depends on swift-winui, whose
      # own compile-time prerequisite is the Windows 10.0.17763.0 SDK
      # (https://github.com/moreSwift/swift-winui#compiletime-dependencies:
      # `winget install --id Microsoft.WindowsSDK.10.0.17763`). No install step
      # is added here: actions/runner-images' own Windows2022-Readme.md lists
      # 10.0.17763.0 among the SDKs windows-latest already ships, and winget
      # itself isn't in that image's documented tool inventory, so adding an
      # unverified winget step would trade a real, checked prerequisite for an
      # unverified one. If a future runner image drops this SDK, that will
      # surface as a hard failure in "Build (release)" below — the fix then is
      # a pinned SDK install step here, not a silent workaround.

      # WinUIBackend needs the MSVC linker + Windows SDK environment that
      # Visual Studio's vcvars normally sets up — swift-cross-ui's own CI
      # (build-test-and-docs.yml, windows job) does the same before building
      # WinUIBackend. Pinned to the v5 tag's commit, not a floating major-version ref.
      - name: Setup VS Dev Environment
        uses: seanmiddleditch/gha-setup-vsdevenv@cf96bf5b227cac6af28c04c4a4e69286ea444163 # v5

      # Installs the Swift toolchain + Windows SDK via the official
      # Swift-on-Windows action. We use compnerd (not SwiftyLab) because recent
      # swift.org Windows installers are published WITHOUT a `.sig` file, and
      # SwiftyLab hard-fails signature verification ("No signature at
      # .../windows10.exe.sig"). compnerd installs directly, no swiftorg signature
      # gate. It needs BOTH the release branch and the build id. Pinned to the
      # v0.4.0 tag's commit, not the floating `main` branch.
      - uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # v0.4.0
        with:
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE

      # Same rationale as the macOS leg's cache step: a from-scratch compile of
      # swift-cross-ui's dependency closure is the dominant cost of this job
      # (Build (release) alone ran ~19 minutes with no cache), and Windows is
      # already the slower leg due to the toolchain/VS setup steps above.
      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: windows-build-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            windows-build-spm-

      - name: Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cuesync-windows
          path: .build/release/
          if-no-files-found: ignore

  windows-test:
    name: swift · windows-latest (test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup VS Dev Environment
        uses: seanmiddleditch/gha-setup-vsdevenv@cf96bf5b227cac6af28c04c4a4e69286ea444163 # v5

      - uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # v0.4.0
        with:
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE

      # Keyed separately from windows-build's cache: this job only ever builds
      # CueSyncCoreTests' own dependency subset (CueSyncCore/CSQLite/CZlib),
      # never the CueSync executable target or swift-cross-ui, so its .build
      # is a different, much smaller artifact set.
      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: windows-test-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            windows-test-spm-

      - name: Swift version
        run: swift --version

      # On Windows, `swift test` spawns BOTH the XCTest runner and the
      # swift-testing runner. The swift-testing runner finds 0 tests (the suite
      # is XCTest) and exits non-zero even when every XCTest passes — a spurious
      # failure. So we gate on the XCTest result: fail only if XCTest reports an
      # actual failure; the "0 tests" swift-testing exit is ignored.
      - name: Test
        shell: pwsh
        run: |
          $out = swift test -c release 2>&1 | Tee-Object -Variable log | Out-String
          if ($out -match "with (\d+) failures") {
            $fails = [int]$Matches[1]
            if ($fails -gt 0) { Write-Error "XCTest reported $fails failure(s)"; exit 1 }
            Write-Host "All XCTest tests passed ($fails failures)."
            exit 0
          }
          # No XCTest summary line found — surface the real exit for diagnosis.
          if ($LASTEXITCODE -ne 0) { Write-Error "swift test failed and no XCTest summary was found"; exit 1 }
